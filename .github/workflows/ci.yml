name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  differential:
    name: differential vs the Rust binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Build the reference binary from the vendored original
        run: cargo build --release
        working-directory: source_rust

      - run: npm ci

      - name: Verify the generated tables still match the Rust source
        run: npm run check:tables

      - name: Assemble a corpus
        run: |
          mkdir -p /tmp/loccorpus
          cd /tmp/loccorpus
          for repo in \
            BurntSushi/ripgrep \
            pallets/flask \
            expressjs/express \
            haskell/containers \
            ocaml/dune \
            torvalds/uemacs \
            rust-lang/regex \
            vuejs/core
          do
            git clone -q --depth 1 "https://github.com/$repo" "$(basename "$repo")"
          done

      - name: Generate the synthetic torture tree
        run: node test/differential/make-torture.mjs /tmp/loc-torture

      - name: Run the differential harness
        env:
          LOC_RUST_BIN: ${{ github.workspace }}/source_rust/target/release/loc
          LOC_DIFF_CORPUS: /tmp/loc-torture:/tmp/loccorpus/ripgrep:/tmp/loccorpus/flask:/tmp/loccorpus/express:/tmp/loccorpus/containers:/tmp/loccorpus/dune:/tmp/loccorpus/uemacs:/tmp/loccorpus/regex:/tmp/loccorpus/core
        run: node test/differential/run.mjs

  publish:
    name: publish to npm
    needs: [test, differential]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
